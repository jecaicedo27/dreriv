        // Read CSV content (In a real app, we'd fetch it, but here we embed it or read via hack)
        // Since I can't easily fetch local file in browser subagent without serving it, 
        // I will injecting the CSV data strictly into this JS block in the next step.
        // For now, setup the chart.

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#222' }, textColor: '#DDD' },
            grid: { vertLines: { color: '#444' }, horzLines: { color: '#444' } },
            timeScale: { timeVisible: true, secondsVisible: false }
        });

        const candleSeries = chart.addCandlestickSeries();

        // Data placeholder - will be replaced by python script
        const rawData = `
TIME,OPEN,HIGH,LOW,CLOSE
        `.trim();

        // Helper to parse CSV (very basic)
        function parseCSV(csv) {
            const lines = csv.split('\\n');
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(',');
                if (parts.length < 5) continue;
                // parts[0] is time string like 2026-02-12 14:00:00
                // We need timestamp
                const time = new Date(parts[0]).getTime() / 1000;
                data.push({
                    time: time,
                    open: parseFloat(parts[1]),
                    high: parseFloat(parts[2]),
                    low: parseFloat(parts[3]),
                    close: parseFloat(parts[4])
                });
            }
            return data;
        }

        // Function to be called after injection
        window.loadData = function (csvString) {
            const data = parseCSV(csvString);
            candleSeries.setData(data);
            chart.timeScale().fitContent();
        }
    </script>
